name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag version
        run: |
          node - <<'NODE'
          const plugin = require('./plugin.json');
          const pkg = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (`v${plugin.version}` !== tag) {
            throw new Error(`plugin.json version ${plugin.version} does not match tag ${tag}`);
          }
          if (pkg.version !== plugin.version) {
            throw new Error(`package.json version ${pkg.version} does not match plugin.json ${plugin.version}`);
          }
          NODE

      - name: Build package
        run: npm run build

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: package.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
